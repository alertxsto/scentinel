[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scentinel"
version = "0.1.0"
description = "CFD simulation studio for gas sensor placement in waste collection vehicles"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dwiky Candra" },
    { name = "Gesang Hemas Bayu Sekti" },
    { name = "Ezekiel Benedicte Felice" },
]
maintainers = [{ name = "Scentinel" }]

dependencies = [
    "PySide6-Essentials>=6.11",
]

[project.optional-dependencies]
# Meshing and field visualisation — required from F1/F2 onwards.
cfd = [
    "gmsh>=4.15",
    "pyvista>=0.49",
    "pyvistaqt>=0.13",
    "vtk>=9.5",
]
# Reporting and plotting extras.
report = [
    "jinja2>=3.1",
    "numpy>=2.0",
    "pyqtgraph>=0.13",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "openpyxl>=3.1",
    "scrapling[fetchers]>=0.4",
    "weasyprint>=62",
]

[project.gui-scripts]
scentinel = "scentinel.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires podman and the OpenFOAM container image",
    "verification: physics verification tests (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
