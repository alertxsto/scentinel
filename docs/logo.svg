<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Scentinel">
  <title>Scentinel</title>
  <defs>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7d5c"/>
      <stop offset="1" stop-color="#174c36"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd6b4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8fd6b4" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="#0f2e22"/>

  <!-- waste mound inside the bin -->
  <path d="M24 92 C34 74 44 70 56 82 C66 92 74 92 82 84 C90 76 98 78 104 92 Z"
        fill="url(#plume)"/>

  <!-- bin body -->
  <path d="M22 92 H106 V104 a6 6 0 0 1 -6 6 H28 a6 6 0 0 1 -6 -6 Z"
        fill="url(#bin)"/>

  <!-- dispersing plume -->
  <g stroke="#a8e6c4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M50 80 C44 66 52 56 46 42" stroke-width="4"/>
    <path d="M64 76 C58 60 66 52 60 34" stroke-width="4"/>
    <path d="M78 80 C74 68 80 60 76 46" stroke-width="4"/>
  </g>

  <!-- sensor node -->
  <circle cx="96" cy="46" r="11" fill="#e8f6ee" stroke="#2f7d5c" stroke-width="4"/>
  <circle cx="96" cy="46" r="3.5" fill="#d32f2f"/>
</svg>
